[workspace]
resolver = "2"
members = [
	"crates/bliti",
	"crates/bliti-core",
	"crates/bliti-wire-compat",
	"crates/bliti-web",
]

[workspace.lints.rust]
# No blanket ban on unsafe: this is a daemon that talks to hardware, and reading a fuel gauge over
# I2C or a GPIO line means ioctls. Each such block carries a SAFETY comment saying what makes it
# sound.
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.dependencies]
# The wire protocol baseline the oracle of `bliti-wire-compat` compares the current build against.
# Pinned by revision, and moving it is the deliberate act: before the first release, where breaking
# the protocol is free, a break moves this; afterwards it moves only alongside the version marker of
# VER. It cannot precede the commit that added `bliti-core`'s message generator, because the oracle
# calls the baseline build's own.
#
# It does not yet carry one: this revision precedes the generator, so the oracle drives the
# baseline-to-current direction from the recorded corpus instead. Moving this to a revision built
# with `generate` upgrades that direction to live generation, and the `features` key below gains
# `"generate"` at the same time.
bliti-core-baseline = { package = "bliti-core", git = "https://github.com/beyondessential/bliti.git", rev = "638c4db7ec55bebd85cf0be10821fd2d8123ff3e", default-features = false }
clap = { version = "4.6.1", features = ["cargo", "derive", "wrap_help"] }
futures = "0.3.30"
rand = "0.10.1"
thiserror = "2.0.16"
tokio = "1.47.1"
tokio-util = "0.7.16"
tracing = { version = "0.1.43", features = ["attributes"] }

[profile.release]
lto = false
codegen-units = 16
strip = "symbols"

# What the device image ships: the daemon runs on small boards, so the build trades
# compile time for a smaller, faster binary.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"

# What the browser client ships: `opt-level = "s"` rather than the release profile's speed-tuned
# `3`, because the module crosses a phone network before it runs. One codegen unit and LTO so that
# identical monomorphisations are merged rather than emitted once per unit. `"z"` was measured and
# comes out larger here, so this is "s" deliberately.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev.build-override]
opt-level = 0
codegen-units = 1024
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.release.build-override]
opt-level = 0
codegen-units = 1024
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
