# The text console opens the console command with no login (PMED).
[Unit]
After=bliti-provision.service

[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --noreset --noclear --issue-file=/etc/issue:/etc/issue.d:/run/issue.d:/usr/lib/issue.d --autologin root --login-program /usr/local/libexec/bliti-provision-console - ${TERM}
