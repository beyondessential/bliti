# The serial console opens the console command with no login (PMED). ttyAMA10 is the Pi 5's debug
# UART, which the `pi` image's command line names as serial0.
[Unit]
After=bliti-provision.service

[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --noreset --noclear --issue-file=/etc/issue:/etc/issue.d:/run/issue.d:/usr/lib/issue.d --keep-baud 115200,57600,38400,9600 --autologin root --login-program /usr/local/libexec/bliti-provision-console - ${TERM}
