# Recorded wire messages, not prose. Member names in them are machine-generated from a six-letter
# alphabet, so short dictionary-adjacent strings (`ba`, `iz`, `ehr`) turn up by chance and mean
# nothing. The corpus README beside them is prose and stays checked.
[files]
extend-exclude = [
	"crates/bliti-wire-compat/baseline-snapshot.jsonl",
	"crates/bliti-wire-compat/corpus/*.json",
	"crates/bliti-web/app/src/countries.js",
]

[default]

[default.extend-words]
invokable = "invokable" # Workhorse-managed wording (AGENTS.md, skills)
unparseable = "unparseable" # incredibly common typo and honestly idgaf
Emitable = "Emitable" # upstream typo in wl-nl80211
FILS = "FILS" # Fast Initial Link Setup
Oif = "Oif" # route output interface
