<!-- spec: none yet (working doc: .workhorse/working-docs/f4/working-doc.md, The provisioning client) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Provisioning an Iti, every screen</title>
<style>
/* The visual language of the client: the prototype page's shapes, in Tamanu Iti's colours. */
:root {
	--page: #fbfbfa;
	--surface: #ffffff;
	--line: #e4e2dd;
	--text: #1c1917;
	--muted: #57534e;
	--accent: #326699;
	--bad: #b91c1c;
	--warn: #a16207;
	--good: #15803d;
}
* { box-sizing: border-box; }
body {
	margin: 0;
	padding: 16px;
	background: var(--page);
	color: var(--text);
	font: 16px/1.5 system-ui, sans-serif;
}
main { max-width: 34rem; margin: 0 auto; }
h1 { font-size: 1.25rem; margin: 0 0 16px; }
section {
	background: var(--surface);
	border: 1px solid var(--line);
	border-radius: 8px;
	padding: 16px;
	margin-bottom: 12px;
}
h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
button {
	font: inherit;
	padding: 12px 16px;
	min-height: 44px;
	border: 0;
	border-radius: 6px;
	background: var(--accent);
	color: #fff;
	cursor: pointer;
}
button:disabled { background: var(--muted); opacity: 0.5; cursor: default; }
button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
input {
	font: inherit;
	width: 100%;
	padding: 12px;
	border: 1px solid var(--line);
	border-radius: 6px;
	background: var(--page);
	color: var(--text);
}
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.code { font-family: ui-monospace, monospace; font-size: 0.85rem; word-break: break-all; }
.muted { color: var(--muted); font-size: 0.9rem; }
.bad { color: var(--bad); }
.warn { color: var(--warn); }
.good { color: var(--good); }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
dt { color: var(--muted); font-size: 0.9rem; }
dd { margin: 0; }
video { width: 100%; border-radius: 6px; background: #000; }
.log { max-height: 9rem; overflow-y: auto; }
.log p { margin: 0 0 4px; }

/* A device newer than this build, or one not speaking the protocol. Neither blanks the view: what
   the application did understand is still on screen beneath it (BLI-MSG). */
.notice {
	border: 1px solid var(--line);
	border-left: 3px solid var(--warn);
	border-radius: 4px;
	padding: 8px 12px;
	margin: 0 0 12px;
	font-size: 0.9rem;
}
.notice.fault { border-left-color: var(--bad); }

/* Tiles. The face carries a label and the headline value and nothing else; the rest is revealed by
   tapping, so one surface serves a non-technician at a glance and a technician who needs the
   figures behind it (BLI-SYS). */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile {
	background: var(--surface);
	border: 1px solid var(--line);
	border-radius: 8px;
	padding: 12px;
	min-height: 0;
	text-align: left;
	font: inherit;
	color: inherit;
	width: 100%;
	display: block;
	cursor: pointer;
}
.tile.wide { grid-column: 1 / -1; }
.tile.expanded { border-color: var(--accent); }
.tile .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
/* A tile showing settings the device is trying rather than has recorded (VIEW). */
.tile .value { font-size: 1.7rem; line-height: 1.25; font-variant-numeric: tabular-nums; }
.tile .value.small { font-size: 1rem; line-height: 1.5; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.tile .value .addresses { display: flex; flex-direction: column; font-size: 1rem; line-height: 1.5; }
.tile .value .part { color: var(--muted); font-size: 0.8rem; }
.tile .value .margin { font-size: 0.8rem; }
.tile .value .warn { color: var(--warn); }
.tile .value .bad { color: var(--bad); }
.tile .value.warn { color: var(--warn); }
.tile .value.bad { color: var(--bad); }

.detail { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
.revealed + .revealed { margin-top: 12px; }
.detail dl { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.detail dt { color: var(--muted); font-size: 0.85rem; }
.detail dd { margin: 0; font-size: 0.85rem; }
.detail .note { margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }
/* How far either way a reading may be off, beside its value (VIEW). */
.margin { color: var(--muted); margin-left: 6px; }

/* The code a phone joins the hotspot by. It draws in the text colour over nothing, so its quiet zone
   is whatever the surface behind it is, in any theme. */
.join { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.join .qr {
	width: 12rem;
	max-width: 100%;
	aspect-ratio: 1;
	background: var(--surface);
	color: var(--text);
	border: 1px solid var(--line);
	border-radius: 6px;
}
.join .qr svg { display: block; width: 100%; height: 100%; }
.join .caption { font-size: 0.85rem; color: var(--muted); }

.bar { height: 4px; background: #eceae5; border-radius: 2px; position: relative; overflow: visible; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.bar.warn > span { background: var(--warn); }
.bar .trip { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: 0.5; }
.spark { display: block; width: 100%; height: 32px; margin-top: 8px; }

.mirror { position: relative; margin-top: 10px; }
.mirror .spark { height: 68px; }
.axis-label { position: absolute; left: 0; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.04em; }
.axis-label.up { top: 0; }
.axis-label.down { bottom: 0; }

.sr-only {
	position: absolute;
	width: 1px; height: 1px;
	padding: 0; margin: -1px;
	overflow: hidden;
	clip-path: inset(50%);
	white-space: nowrap;
}

/* An address or a board name has no spaces to break at, so it must be allowed to break anywhere
   rather than running out past the edge of its tile. */
.tile .value, .detail dd, .detail .note, .detail p { overflow-wrap: anywhere; }
/* A tile with nothing behind its headline is not a tap target. */
.tile.flat { cursor: default; }

/* A section heading with an action beside it. */
.heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.heading h2 { margin: 0 0 12px; }
button.small { padding: 6px 12px; min-height: 0; font-size: 0.85rem; margin-bottom: 12px; }

/* The activity log doubles as a debug surface, so it reads as a record of the conversation: when,
   which way, and what. Oldest first, because that is the order things happened in. */
.log { max-height: 16rem; overflow-y: auto; font-size: 0.8rem; }
.log .line {
	display: grid;
	grid-template-columns: auto auto 1fr;
	gap: 8px;
	margin: 0 0 2px;
	align-items: baseline;
}
.log time { color: var(--muted); font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
.log .arrow { color: var(--muted); }
.log .said { overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
.log .in .arrow { color: var(--accent); }
.log .out .arrow { color: var(--good); }
.log .note { color: var(--muted); }

/* The tiles are no longer inside a section, so they carry the spacing a section would have given
   them and keep the rhythm with whatever follows. */
.tiles { margin-bottom: 12px; }

/* An opened tile takes the whole row: the detail is figures and graphs, and reading those through a
   half-width column is what the tap was avoiding. */
.tile.expanded { grid-column: 1 / -1; }

/* A reading whose detail lists several things separates them, so a figure sits under the thing it
   belongs to rather than against the one above. */
.detail dl + dl { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.detail dt { white-space: pre; }

/* Which line is which, on a graph with one above the axis and one below. */
.axis-label .key {
	display: inline-block;
	width: 10px;
	height: 2px;
	vertical-align: middle;
	margin-right: 4px;
}
.axis-label .key.out { background: var(--good); }
.axis-label .key.in { background: var(--accent); }

/* Two actions beside a heading. */
.heading .actions { display: flex; gap: 8px; }

/* A screen's title, with its actions beside it. Every screen of a connected device carries one in
   the same place, so moving between them keeps the operator at one level (VIEW). */
.heading.title { margin-bottom: 16px; }
.heading.title h1 { margin: 0; }
/* Taps on a title count towards dev mode, so a row of them must not select its text or zoom (WEB). */
.heading.title h1 { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.heading.title button.small { margin-bottom: 0; padding: 6px 10px; }
.heading.title .offline { color: var(--bad); font-size: 0.9rem; }

/* The acts of the Control screen, one row each: what it does, and the button that asks for it. The
   confirmation takes the list's place, so it reads as the answer to the button pressed (CSCR). */
.acts { list-style: none; margin: 0; padding: 0; }
.acts li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.acts li:first-child { border-top: 0; padding-top: 0; }
.acts li > div { flex: 1 1 auto; }
.acts .name { display: block; }
.acts button { flex: 0 0 auto; min-height: 0; padding: 8px 14px; font-size: 0.9rem; }
button.secondary.danger { color: var(--bad); border-color: var(--bad); }

/* What the device gives for its battery, above the battery section's rows (CSCR). */
.learnt { margin: 0 0 10px; }

/* A confirmation takes its act's button's place, beneath the act it asks about (CSCR). */
.acts li.asking { display: block; }
.acts .bar-state { margin: 10px 0 0; }
.acts .bar-state .row.fill > * { flex: 1 1 auto; }

/* The devices this tab has reached are laid out as the acts are: which device, and the button that
   holds its code again (WEB). */
.device-name { display: block; margin: 0 0 4px; }
button.danger-fill { background: var(--bad); }
.bar-state[role="alertdialog"] .row > * { flex: 0 1 auto; }

/* The network configuration screen. Its component shapes are the design's (network-configuration),
   scoped here so the device view keeps the ones it already has. */
select, textarea {
	font: inherit;
	width: 100%;
	padding: 12px;
	border: 1px solid var(--line);
	border-radius: 6px;
	background: var(--page);
	color: var(--text);
}
textarea { min-height: 6rem; font-family: ui-monospace, monospace; font-size: 0.8rem; }
input:disabled, select:disabled, textarea:disabled { color: var(--muted); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

.network .heading { margin: 0 0 12px; }
.network .heading h2 { margin: 0; }
.network .heading.title h1 { margin: 0; }
.network .heading.title { margin-bottom: 16px; }
.network button.small { padding: 6px 10px; margin-bottom: 0; }

/* The ordering. Each row is a candidate the device may attach by, in the order it tries them. The
   handle is the whole point of the row, so it reads as a list that is meant to be rearranged. */
.order { list-style: none; margin: 0; padding: 0; }
.order li {
	display: flex;
	align-items: baseline;
	gap: 10px;
	padding: 10px 0;
	border-top: 1px solid var(--line);
}
.order li:first-child { border-top: 0; }
.order button.grip, .order button.what {
	background: transparent;
	color: inherit;
	padding: 0;
	min-height: 0;
	border: 0;
	border-radius: 0;
	text-align: left;
	font: inherit;
}
.order button.grip { color: var(--muted); cursor: grab; font-size: 0.9rem; letter-spacing: -1px; touch-action: none; }
.order button.grip:disabled { cursor: default; opacity: 0.4; background: transparent; }
.order button.what { flex: 1 1 auto; min-width: 0; cursor: pointer; }
.order li.selected .what .name { color: var(--accent); }
/* The candidate being edited, and its fields below, are unmistakably the same one. */
.order li.selected {
	background: #eef3f8;
	box-shadow: inset 3px 0 0 var(--accent);
	margin: 0 -12px;
	padding-left: 12px;
	padding-right: 12px;
}
section.candidate { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.what .name { overflow-wrap: anywhere; }
.what .kind { color: var(--muted); font-size: 0.8rem; }
.state { font-size: 0.8rem; white-space: nowrap; }
.state.good { color: var(--good); }
.state.muted { color: var(--muted); }
.state.bad { color: var(--bad); }
.adding { margin: 0 0 12px; }
.adding > * { flex: 0 1 auto; }

/* Where a change failed. The stages are the device's own account of how far it got, so an operator
   reads "the key was right, the network is not routing" without being told it in prose. */
.stages { display: flex; flex-direction: column; gap: 2px; margin: 8px 0 0; font-size: 0.8rem; }
.stages span::before { margin-right: 4px; }
.stages .done { color: var(--good); }
.stages .done::before { content: "\2713"; }
.stages .failed { color: var(--bad); }
.stages .failed::before { content: "\2717"; }
.stages .untried { color: var(--muted); }
/* A candidate not checked when applied: offered where its checking failed, and said wherever it is
   off, so an operator never loses track of which ones can fail without stopping a change. */
.network .unchecked { margin: 0 0 12px; }
.network .unchecked p { margin: 0 0 8px; font-size: 0.85rem; }
.field-fault { border-color: var(--bad); }
.why { color: var(--bad); font-size: 0.85rem; margin: 6px 0 0; }
.why.reason { margin-bottom: 12px; }

.network label { display: block; font-size: 0.8rem; color: var(--muted); margin: 12px 0 4px; }
.network label:first-of-type { margin-top: 0; }
.network details label:first-of-type, .network .absent + label { margin-top: 12px; }
.network .check { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 0.9rem; color: var(--text); }
.network .check input { width: auto; padding: 0; }
/* The bands a wireless connection may use, one box each, reading as the field labels do. */
.network .bands legend { padding: 0; font-size: 0.8rem; color: var(--muted); margin: 12px 0 0; }
.network .bands { display: flex; flex-wrap: wrap; gap: 0 16px; }
.network .bands legend { flex-basis: 100%; }
.network details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.network summary { font-size: 0.85rem; color: var(--accent); cursor: pointer; }
.pair { display: flex; gap: 8px; }
.pair > * { flex: 1 1 0; }
.pair > button { flex: 0 0 auto; }
.network .hint { margin: 6px 0 0; }
/* The countries a scan heard named. Unset, the suggestion is the next thing to do, so it carries the
   primary button; set to another country, it is a line beneath the field. */
.network .suggest { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
.network .suggest > p:first-child { margin: 0 0 8px; font-size: 0.9rem; }
.network .suggest .row > * { flex: 0 1 auto; }
.network .aside, .network .also { margin: 6px 0 0; font-size: 0.85rem; }
.network .suggest .also { margin-top: 8px; }
.network .aside button.link { margin-left: 4px; }
.network .aside button.link + button.link::before, .network .also button.link + button.link::before {
	content: "\00b7";
	color: var(--muted);
	margin: 0 6px;
}
.network .absent { margin: 12px 0 0; }
.network .survey { margin-top: 12px; }

.networks, .spectrum, .points { list-style: none; margin: 8px 0 0; padding: 0; font-size: 0.85rem; }
.networks li, .spectrum li, .points li { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 4px 0; }

/* A scan, read by network or for siting. A network's row opens onto the access points behind it,
   which sit indented beneath it so they read as its own. */
.scan { margin-top: 12px; }
.scan .views { gap: 6px; }
.scan .views > * { flex: 0 1 auto; }
.scan .views button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.networks li.network-row { display: block; border-top: 1px solid var(--line); }
.networks li.network-row:first-child { border-top: 0; }
.network-row .line { display: flex; align-items: baseline; gap: 8px; }
.network-row .line > .muted { flex: 1 1 auto; }
.network-row .points { margin: 4px 0 4px 12px; }
.points li > :first-child { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.points li > :last-child { text-align: right; }
.points .code { font-size: 0.8rem; }
/* A BSSID is read whole: two access points from one vendor differ only at the end. The detail
   beside it wraps instead. */
.points li > .code { flex: none; overflow: visible; }
.scan .check { margin-top: 10px; }
button.link { background: transparent; color: var(--accent); padding: 0; min-height: 0; border: 0; font-size: 0.85rem; }
.siting h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 12px 0 0; }

/* The action bar. It says which stage the operator is in and offers only what that stage allows,
   because the four are easy to confuse: a change being edited, a change being checked, a change that
   failed, and a change running but not saved all look alike otherwise. Pinned to the bottom of the
   viewport, so whether what runs is saved never scrolls out of sight. */
.bar-state {
	background: var(--surface);
	border: 1px solid var(--line);
	border-left: 3px solid var(--warn);
	border-radius: 8px;
	padding: 12px 16px;
}
.bar-state.working { border-left-color: var(--accent); }
.bar-state.failed { border-left-color: var(--bad); }
.bar-state p { margin: 0 0 10px; font-size: 0.9rem; }
.bar-state .row > * { flex: 0 1 auto; }
.bar-state.sticky { position: sticky; bottom: 8px; z-index: 1; }

/* Something under way: an apply being checked, a scan, a survey, the session opening. */
.spinner {
	display: inline-block;
	width: 0.8em;
	height: 0.8em;
	margin-right: 6px;
	vertical-align: -0.05em;
	border: 2px solid currentColor;
	border-right-color: transparent;
	border-radius: 50%;
	animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

/* Where the operator is in reaching a device: done steps ticked, the current one named in full, so
   how much is left is answered without reading anything else (WEB). */
.steps { list-style: none; display: flex; margin: 0 0 16px; padding: 0; }
.steps li { flex: 1 1 0; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--muted); text-align: center; }
.steps li + li::before { content: ""; position: absolute; top: 11px; right: 50%; width: 100%; height: 2px; background: var(--line); }
.steps li.done::before, .steps li.current::before { background: var(--accent); }
.steps .dot { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 0.75rem; font-weight: 600; }
.steps li.current .dot { border-color: var(--accent); color: var(--accent); }
.steps li.done .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.steps li.current .name { color: var(--text); font-weight: 600; }

/* The one instruction a step carries: what to do, in a line, with a sentence of help beneath. */
.lead { font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; }
.lead + .muted { margin: 0 0 12px; }
.lead.problem { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.alert { flex: 0 0 auto; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: #fbeaea; color: var(--bad); display: grid; place-items: center; font-size: 0.85rem; font-weight: 400; line-height: 1; }
.done-line { color: var(--good); font-size: 0.85rem; font-weight: 600; margin: 0 0 8px; }
.done-line::before { content: "\2713"; margin-right: 6px; }
.chip { display: block; text-align: center; font-family: ui-monospace, monospace; font-size: 1rem; letter-spacing: 0.05em; padding: 8px 10px; margin: 8px 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); overflow-wrap: anywhere; }
button.block { width: 100%; }
.links { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 12px; }
.steps-body video { margin: 0 0 12px; aspect-ratio: 4 / 3; object-fit: cover; }
.steps-body .why { margin: 0 0 12px; }

/* What only technical staff need, behind a section that stays closed until opened (WEB). */
details.advanced { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
details.advanced > summary { display: flex; align-items: center; justify-content: space-between; padding: 16px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); cursor: pointer; list-style: none; }
details.advanced > summary::-webkit-details-marker { display: none; }
details.advanced > summary::after { content: ""; width: 7px; height: 7px; margin: -4px 4px 0 0; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
details.advanced[open] > summary { border-bottom: 1px solid var(--line); }
details.advanced[open] > summary::after { margin-top: 4px; transform: rotate(-135deg); }
details.advanced .inside { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
details.advanced label { font-size: 0.8rem; color: var(--muted); }
details.advanced input { font-family: ui-monospace, monospace; font-size: 0.85rem; }
details.advanced .why { margin: 0; }

/* A title's actions wrap among themselves rather than squeezing it, where there are several. */
.heading.title h1 { flex: 0 0 auto; }
.heading.title .actions { flex: 1 1 0; flex-wrap: wrap; justify-content: flex-end; }

/* The Status screen (STAT). Its title carries the device's software identity beneath it. */
.heading.title:has(.software) { align-items: flex-start; }
.heading.title .software { margin: 2px 0 0; font-size: 0.8rem; }

/* A row each for the network, Tailscale and Tamanu: a mark, what it says, and the detail beneath. */
.health { list-style: none; margin: 0; padding: 0; }
.health li { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.health li:first-child { border-top: 0; padding-top: 0; }
.health li:last-child { padding-bottom: 0; }
.health .mark { flex: 0 0 auto; width: 1.5rem; height: 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; line-height: 1; }
.health .mark.good { background: #e8f5ec; color: var(--good); }
.health .mark.good::before { content: "\2713"; }
.health .mark.warn { background: #fdf3e1; color: var(--warn); }
.health .mark.warn::before { content: "!"; font-weight: 700; }
.health .mark.bad { background: #fbeaea; color: var(--bad); }
.health .mark.bad::before { content: "\2717"; }
.health .mark.wait { color: var(--accent); }
.health .mark.wait .spinner { margin: 0; }
.health .body { flex: 1 1 0; min-width: 0; }
.health .name { display: block; font-weight: 600; }
.health .detail { display: block; border: 0; margin: 0; padding: 0; color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.health .detail.reason { color: var(--bad); }
.health .detail.reason.warn { color: var(--warn); }
.health .detail.fact { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.health .sep { margin: 0 5px; opacity: 0.5; }
.health .detail.fact .sep { margin: 0 2px; }
.health .way { flex: 0 0 auto; width: 16px; height: 16px; color: var(--accent); }
.health .way svg { display: block; width: 100%; height: 100%; }
.health .k { margin-right: 6px; opacity: 0.75; }
.health li > button { flex: 1 0 calc(100% - 1.5rem - 10px); margin-left: calc(1.5rem + 10px); min-height: 0; padding: 6px 12px; font-size: 0.85rem; }

/* Advanced: closed, a heading that opens it; open, the ways to every other screen beneath. */
.advanced { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
.advanced .summary { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 0; padding: 14px 16px; background: transparent; border-radius: 8px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); text-align: left; }
.advanced .summary::after { content: ""; width: 7px; height: 7px; margin: -4px 4px 0 0; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
.advanced.open .summary { border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
.advanced.open .summary::after { margin-top: 4px; transform: rotate(-135deg); }
.advanced .inside { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.advanced .inside button { width: 100%; }

/* A row waiting on the device in its button's place: the network row's session opening (NSET), or a
   network check under way (STAT). */
.health li > .busy { flex: 1 0 calc(100% - 1.5rem - 10px); margin-left: calc(1.5rem + 10px); padding: 6px 0; text-align: center; color: var(--accent); font-size: 0.85rem; }

/* The simple network screens (NSET). Each way is a row opening its own screen, the one on marked with
   a tick and a highlight. */
.setup .intro { margin: 0 0 12px; }
.setup .lead .spinner { margin-right: 8px; }
.setup .reason { overflow-wrap: anywhere; }
.setup .links { margin-top: 12px; }
.setup button.block { margin-top: 12px; }
.setup label { display: block; font-size: 0.8rem; color: var(--muted); margin: 12px 0 4px; }
.setup .lead + .muted + label, .setup .lead + .muted + .muted + label { margin-top: 0; }
.ways, .choices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ways button, .choices button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 0; text-align: left; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.ways button.on, .choices button.joined { border: 2px solid var(--good); background: #f0f9f3; padding: 11px 13px; }
.choices button:disabled { background: transparent; opacity: 1; cursor: default; }
.choices button:disabled .name { color: var(--muted); }
.ways .way { flex: 0 0 auto; width: 20px; height: 20px; color: var(--accent); }
.ways .way svg { display: block; width: 100%; height: 100%; }
.ways .body, .choices .body { flex: 1 1 auto; min-width: 0; }
.ways .name, .choices .name { display: block; font-weight: 600; overflow-wrap: anywhere; }
.ways .now { color: var(--muted); font-size: 0.85rem; }
.ways button.on .now, .choices .now { display: block; color: var(--text); font-size: 0.85rem; }
.choices button:disabled .now { color: var(--muted); }
.ways .sep { margin: 0 5px; opacity: 0.5; }
.tick { flex: 0 0 auto; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--good); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
.tick::before { content: "\2713"; }
.chevron { flex: 0 0 auto; color: var(--muted); }
.choices { margin-top: 12px; }
.choices .signal { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.85rem; }
.choices .signal svg { display: block; width: 16px; height: 12px; fill: currentColor; }
.setup .looking { margin-top: 12px; }

/* A password the operator can show while typing it. */
.input-show { position: relative; }
.input-show input { padding-right: 4rem; }
.input-show .link { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }

/* The hotspot, drawn like a phone's: the switch, then what other devices join with. */
.toggle { display: flex; align-items: center; gap: 12px; }
.toggle .body { flex: 1 1 auto; }
.toggle .name { display: block; font-weight: 600; }
.toggle .sub { display: block; color: var(--muted); font-size: 0.85rem; }
button.switch { flex: 0 0 auto; position: relative; width: 48px; height: 28px; min-height: 0; padding: 0; border-radius: 999px; background: #cbd5e1; }
button.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
button.switch.on { background: var(--good); }
button.switch.on::after { left: 23px; }
button.switch:disabled { opacity: 0.4; }
.toggle.disabled .name { color: var(--muted); }
.setup .running { margin: 10px 0 0; }
.setup .details { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
.setup .details dl { gap: 6px 12px; align-items: baseline; }
.setup .details dd { overflow-wrap: anywhere; }
.setup dd.secret { font-family: ui-monospace, monospace; font-size: 0.9rem; }
.setup dd .link { margin-left: 8px; font-family: system-ui, sans-serif; }
.setup .details .join { margin-top: 14px; }
.setup .details .hint { margin: 6px 0 0; }
.setup .details .save { margin-top: 12px; }
.setup .details .save > * { flex: 0 1 auto; }

/* A row's act once pressed: its confirmation, beneath the row in place of its button, so the other
   rows stay where they were (STAT). */
.health li > .bar-state { flex: 1 0 calc(100% - 1.5rem - 10px); margin-left: calc(1.5rem + 10px); }

/* The Tailscale screen's figures: labelled, and what a check found, nearest relay first (TSCR). */
.facts { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 0.85rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.verdict { margin: 0; font-weight: 600; }
.verdict.bad { color: var(--bad); }
.relays { list-style: none; margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); font-size: 0.85rem; }
.relays li { display: flex; justify-content: space-between; padding: 2px 0; }
.relays li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }

/* A form of labelled fields, a field with its button beside it, and the sign-in's ways in (TSCR). */
.flabel { display: block; font-size: 0.8rem; color: var(--muted); margin: 12px 0 4px; }
.flabel:first-child { margin-top: 0; }
.row.inline { flex-wrap: nowrap; }
.row.inline input { flex: 1 1 auto; min-width: 0; }
.row.inline button { flex: 0 0 auto; min-height: 0; }
.form .scan { width: 100%; margin-top: 8px; }
.form video { margin-top: 8px; aspect-ratio: 4 / 3; object-fit: cover; }
.form .go { margin-top: 16px; }
.form .alt { margin: 12px 0 0; text-align: center; }
.form .waiting { margin: 16px 0 0; }
.join.link { margin: 16px 0 8px; }
.form .code { text-align: center; margin: 0 0 12px; color: var(--muted); }

/* Mockup only: the screens side by side at phone width. */
body { padding: 24px; }
.screens { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
figure { margin: 0; width: 380px; }
figcaption { font-size: 0.8rem; color: var(--muted); margin: 0 0 8px; }
figure main { background: var(--page); border: 1px solid var(--line); border-radius: 12px; padding: 16px; max-width: none; }
/* New: a board picture inside a step, and a step's prompt beneath its row. */
.pic-caption { font-size: 0.85rem; color: var(--muted); margin: -6px 0 12px; }
.away { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
img.board { display: block; width: 100%; border-radius: 6px; margin: 0 0 12px; }
.health li > .prompt { flex: 1 0 calc(100% - 1.5rem - 10px); margin-left: calc(1.5rem + 10px); }
.health li > .prompt .lead { font-size: 1rem; }
</style>
</head>
