# Install to /etc/systemd/journald.conf.d/10-bliti.conf, then restart
# systemd-journald.
#
# A device on a backup supply ends a run on battery with its power cut, not a
# shutdown, and journald only writes the journal to disk every five minutes by
# default. The last minutes before the cut are lost with it, which are the ones
# DEV's backup supply reports exist for: the voltage the device last ran at, and
# when it stopped. Measured on a Pi 5: a boot's journal ended four minutes before
# the device did.
#
# Fifteen seconds is one write every fifteen seconds to storage that is written
# far more often than that anyway.
[Journal]
SyncIntervalSec=15s
