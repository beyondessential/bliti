# Install to /etc/systemd/system/iwd.service.d/10-bliti.conf
#
# Keeps iwd off the hotspot's interface. iwd takes over every interface on a
# radio it manages, so without this it adopts ap0, the access point interface
# bliti creates beside the station for hostapd, and the hotspot never comes up.
# It has to be a command-line option: iwd's main.conf has no setting for it.
#
# With any interface filter given, iwd also stops deleting and recreating the
# radio's interfaces when it starts, so restarting iwd leaves ap0 standing.
#
# ap0 is the access point interface the device's hardware description names.
# If that changes, this changes with it.
#
# The path to the daemon is spelled out because overriding ExecStart requires
# it, and it differs between distributions (/usr/libexec on Debian and Ubuntu,
# /usr/lib/iwd elsewhere). If an iwd upgrade moves it, iwd.service fails to
# start and says so, rather than quietly taking the hotspot's interface.
#
# iwd reads its known networks and main.conf from where bliti renders them,
# under /run, so that a proposal never outlives a reboot. iwd.service asks for
# StateDirectory= and ConfigurationDirectory=, which would set the two
# variables to the /var/lib and /etc defaults; both are emptied here so that
# only the values below are set.
[Service]
StateDirectory=
ConfigurationDirectory=
Environment=STATE_DIRECTORY=/run/bliti/iwd
Environment=CONFIGURATION_DIRECTORY=/run/bliti/iwd-config
ExecStart=
ExecStart=/usr/libexec/iwd --nointerfaces ap0
