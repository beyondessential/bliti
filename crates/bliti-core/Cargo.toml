[package]
name = "bliti-core"
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"
resolver = "2"

authors = ["Félix Saparelli <felix@passcod.name>", "BES Developers <contact@bes.au>"]
license = "GPL-3.0-or-later"
description = "Protocol core for bliti, the QR-anchored BLE device provisioning protocol"
keywords = ["bliti", "ble", "provisioning", "noise", "argon2"]
categories = ["embedded", "network-programming", "cryptography"]
repository = "https://github.com/beyondessential/bliti"

[lints]
workspace = true

[features]
default = ["derive", "backends", "parallel"]
# Memory-hard presence-token derivation (argon2id). Needed by the device and the
# QR code generator, never by a client, and deliberately absent from wasm builds.
derive = ["dep:argon2"]
# Board-ID backends that read real hardware and firmware. Off for wasm, which has
# no filesystem and never reads a board ID.
backends = []
# TPM Endorsement Key board-ID backend. Carries the tpm2-tss C library, so it is off by default
# and the daemon turns it on unconditionally: which sources a build can see decides which one
# wins the precedence, and so which presence token a board derives.
tpm = ["backends", "dep:tss-esapi"]
# Compute the argon2id lanes concurrently. Purely a speed choice: the parameters fix the digest, so
# a secret derived with this on is identical to one derived with it off (pinned by a known-answer
# test). Worth having on the device and the generator, both of which sit on a provisioning path.
parallel = ["argon2?/parallel"]
# Strategies generating conforming application messages, for the wire compatibility oracle of
# `bliti-wire-compat`. An optional dependency rather than a dev-dependency: the oracle links two
# builds of this crate and needs the generator from each, and a dev-dependency is invisible to
# anything depending on the crate.
generate = ["dep:proptest"]

[dependencies]
argon2 = { version = "0.6.0", optional = true }
blake3 = { version = "1.8.7", default-features = false }
curve25519-dalek = { version = "4.1.3", default-features = false }
data-encoding = "2.11.1"
# zlib for the channel compression of CHN. The pure-Rust `miniz_oxide` backend, not a C or `zlib-rs`
# one: it builds for wasm and costs about a third of `zlib-rs` in the browser bundle, and the speed
# `zlib-rs` buys does not matter to messages of a few hundred bytes on a device with time to spare.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures.workspace = true
proptest = { version = "1.11.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# default-features off to keep snow's `std` feature from pulling in `ring`, which is unused (the
# pure-Rust resolver is selected below) and does not belong in a wasm build. The crypto is named one
# primitive at a time rather than through the `default-resolver-crypto` umbrella, which would also
# carry AES-GCM and SHA-2: the protocol fixes a single pattern (see `channel::noise::NOISE_PARAMS`),
# and the resolver dispatches over whatever is compiled in at runtime, so nothing unused can be
# dropped later. Naming the four the pattern uses takes about 11 kB, compressed, off the browser
# bundle. Adding a pattern means adding its primitives here.
snow = { version = "0.10.0", default-features = false, features = [
	"default-resolver",
	"use-blake2",
	"use-chacha20poly1305",
	"use-curve25519",
	"use-getrandom",
] }
thiserror.workspace = true
tss-esapi = { version = "7.7.0", optional = true }
uuid = { version = "1.26.1", default-features = false }
yamux = "0.14.0"

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "time", "sync"] }
tokio-util = { workspace = true, features = ["compat"] }
