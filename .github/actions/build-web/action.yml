name: Build the browser client
description: Build the static bundle of the browser client into crates/bliti-web/app/dist.

inputs:
  build:
    description: >-
      Names the build, which the client reports as build metadata on its version. Left empty, it
      reports the package version alone.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure toolchain
      shell: bash
      run: |
        rustup toolchain install --profile minimal --no-self-update stable
        rustup default stable
        rustup target add wasm32-unknown-unknown
    # Only the default branch writes the cache; every other ref restores it read-only, so branches
    # do not evict each other and rebuild cold.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: wasm
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: taiki-e/install-action@v2
      with:
        tool: just
    # The pair is version-locked, so the version comes from the lockfile rather than being
    # written here too. A prebuilt binary rather than `just setup`'s `cargo install`, which
    # would compile it from source on every run.
    - id: wasm-bindgen
      shell: bash
      run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: crates/bliti-web/app/package-lock.json

    # The browser client takes bliti-core without its default features, so it
    # carries neither the argon2 derivation nor any board-ID backend, and needs
    # no system libraries here.
    - name: Build the wasm module
      shell: bash
      run: just build-wasm
    - name: Install the application's dependencies
      shell: bash
      run: npm ci
      working-directory: crates/bliti-web/app
    - name: Build the static bundle
      shell: bash
      run: just build
      env:
        BLITI_BUILD: ${{ inputs.build }}
