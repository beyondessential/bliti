name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_UNSTABLE_SPARSE_REGISTRY: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# Cache strategy (the `with:` on every rust-cache step below):
#   - shared-key: every job builds the same workspace, so they share one cache
#     rather than a cache each.
#   - save-if: only the default branch writes the cache; PRs and the merge queue
#     restore it read-only, so branches don't evict each other and rebuild cold.
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      # bluer links the system libdbus, and the TPM board-ID backend links
      # tpm2-tss. Both are on by default, and the TPM one deliberately so: which
      # board-ID sources a build can see decides which presence token a board
      # derives, so CI builds the same set the device does.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libtss2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
          rustup component add clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libtss2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features

  web:
    name: Browser client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # The pair is version-locked, so the version comes from the lockfile rather than being
      # written here too. A prebuilt binary rather than `just setup`'s `cargo install`, which
      # would compile it from source on every run.
      - id: wasm-bindgen
        run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/bliti-web/app/package-lock.json

      # The browser client takes bliti-core without its default features, so it
      # carries neither the argon2 derivation nor any board-ID backend, and needs
      # no system libraries here.
      - name: Build the wasm module
        run: just build-wasm
      - name: Install the application's dependencies
        run: npm ci
        working-directory: crates/bliti-web/app
      - name: Build the static bundle
        run: just build

      # Kept so that hosting it at the QR code's origin is later wiring rather
      # than work.
      - uses: actions/upload-artifact@v4
        with:
          name: bliti-web
          path: crates/bliti-web/app/dist
          if-no-files-found: error

      # The harness fakes at the message layer, with no wasm and no Bluetooth in
      # the loop. Protocol and transport coverage stays in the Rust tests, and
      # nothing here pretends to be a Bluetooth stack.
      #
      # It builds its own bundle, in test mode and to its own directory: the seam
      # it supplies a client through is compiled into that build alone, and never
      # into the one uploaded above.
      - name: Install the browser the harness drives
        run: npx playwright install --with-deps chromium
        working-directory: crates/bliti-web/app
      - name: Test the application
        run: npx playwright test
        working-directory: crates/bliti-web/app

  tests-pass:
    if: always()
    name: Tests pass
    needs: [test, clippy, web]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
